version: 1
mode: authored
scope_digest: 4e71e9c2d7f0e9ff70521bd39ba59803a1903cb2ea52bbcc7ff90f764509fe86
title: 用 JavaScript 实现贪吃蛇
language: zh-CN
intro: |
  贪吃蛇里，蛇会沿着当前方向持续前进，玩家用方向键改变它的路线。每吃到一颗食物，蛇就长一节；身体越长，留给转弯的空间也就越少。一旦撞到边界或自己的身体，这一局就结束了。

  要在浏览器里做出这样的游戏，需要让画面随时间变化，同时记住蛇和食物的位置。每次移动时，程序还要判断：蛇头将进入哪个格子，那里有没有食物，能不能继续走。屏幕上看见的动作，来自这些位置和规则的共同变化。

  这里采用一块 20 × 20 的棋盘，每吃一颗食物得一分，填满棋盘就获胜。页面提供开始和重新开始的按钮，整个游戏保存在一个 `snake.html` 文件中，用浏览器打开即可运行。
steps:
  - id: page
    title: 准备棋盘和操作区域
    content:
      - text: |
          浏览器中的游戏需要一个显示棋盘的区域。HTML 的 `canvas` 元素可以提供一块绘图表面，脚本能够在上面画出蛇和食物。这里把画布的宽、高都设为 480 像素；至于这些像素怎样对应棋盘上的格子，还需要由程序自己规定。

          棋盘之外，玩家还需要看见分数、开始按钮和当前状态。因此，页面上方放标题、分数和按钮，下方放操作提示，并给需要被脚本访问的元素设置 `id`。例如，脚本可以通过 `score` 找到分数文字，通过 `board` 找到画布。

          文档开头声明使用 HTML，将语言设为中文，并用 UTF-8 保存文字，避免中文显示出错。`head` 中的 `title` 决定浏览器标签页的标题，页面内可见的标题则由 `h1` 显示。脚本放在这些页面元素之后，执行时就能找到它们。
      - code:
          source: page
          focus: ["1-5", "17-27"]
          show: ["1-6", "16-27"]
          notes:
            - lines: "24"
              text: tabindex="0" 让画布可以获得键盘焦点；aria-label 为这块绘图区域提供文字说明。
            - lines: "25"
              text: role="status" 让读屏软件能够感知这段状态文字的变化。
      - text: |
          元素放进去之后，还需要给它们安排位置。页面宽度与画布同为 480 像素，左右自动外边距使整个区域居中；标题栏使用 flex 布局，让标题、分数和按钮横向分布，并在下方留出间距。`h1` 去掉默认外边距，避免标题把这一栏撑得过高。

          页面采用深色背景和浅色文字。按钮有内边距、边框和指针光标，鼠标悬停时背景稍亮；用键盘选中按钮或画布时，则显示绿色轮廓，让玩家知道按键会作用在哪里。画布设置为块元素，并用边框标出绘图区域；段落留出上下间距，状态文字用黄色与普通说明区分。这些规则放在 `style` 中，随页面一起加载。
      - code:
          source: page
          focus: "6-16"
          show: "6-16"

  - id: coordinates
    title: 用格子坐标表示一条蛇
    content:
      - text: |
          画布已经有了宽度，但“向右走一格”还没有对应的距离。如果把 480 像素的宽度分成 20 份，每格就是 24 像素，高度也采用同样的划分。

          可以用两个整数表示一个格子：`x` 表示列，`y` 表示行，左上角从 `(0, 0)` 开始，向右增加 `x`，向下增加 `y`。因此，两条坐标轴的有效范围都是 0 到 19。游戏判断位置时使用格子坐标，真正绘图时再换算成像素。

          一条蛇占据多个格子，还需要区分头尾，所以用数组按蛇头到蛇尾的顺序保存这些坐标。初始蛇长三节，头在 `(8, 10)`，身体依次位于 `(7, 10)` 和 `(6, 10)`，在画面上连成一条水平短线。
      - code:
          source: state
          focus: ["1-2", "6-8"]
          show: ["1-2", "6-8"]
          notes:
            - lines: "2"
              text: 2d 绘图上下文提供设置颜色、填充矩形等操作。
      - text: |
          `document.querySelector` 按 `id` 找到画布，再由 `getContext("2d")` 取得绘图接口。`size` 保存每行的格子数，`cell` 则由画布宽度除以格子数得到，不需要再单独写一遍 24。

          有了坐标和格子宽度，就可以画出一节蛇。比如 `(8, 10)` 对应的格子从像素位置 `(192, 240)` 开始。为了让相邻两节之间有一道间隙，矩形向右、向下各缩进 1 像素，宽、高各减少 2 像素，最终画成 22 × 22 的小方块。`paintCell` 把这个换算封装起来，传入一个坐标就能画一格。
      - code:
          source: paint
          focus: all
          show: all
      - text: |
          画整条蛇时，先把画布填成背景色，再逐个画出数组中的格子。`fillStyle` 决定之后的填充颜色，`fillRect` 负责填矩形；第一次填满整张画布，也就擦掉了上一幅画面。这样即使蛇的位置改变，旧位置也不会留下残影。

          数组中的第一个元素是头，因此遍历时用下标 `index` 区分颜色：头用亮绿，身体用暗绿。其余绘制方式相同，都调用 `paintCell`。
      - code:
          source: draw
          focus: ["1-3", "8-11", "13-14"]
          show: ["1-3", "8-11", "13-14"]
      - text: |
          定义 `draw` 只是保存绘图过程，还不会立即产生画面。脚本末尾调用一次这个函数，浏览器才会根据初始坐标画出三节静止的蛇。
      - code:
          source: boot
          focus: "3"
          show: "3"

  - id: movement
    title: 按固定间隔移动一格
    content:
      - text: |
          现在蛇占据的位置是 `(8, 10) → (7, 10) → (6, 10)`。如果向右前进一格，它应当变成 `(9, 10) → (8, 10) → (7, 10)`。比较这两组坐标可以发现，新的头占据了前方一格，旧尾巴退出，而中间两格仍然属于蛇。

          因此，一次移动可以通过数组两端的变化来完成：在开头加入新头，再删除末尾一节。原来的头会成为第二节，身体也就沿着原来的路线跟上。这个办法同样适用于转弯后的形状。

          还需要记录下一步朝哪个方向。向右时，`x` 每次加 1，`y` 不变，所以把方向保存为 `{ x: 1, y: 0 }`。另外用 `running` 表示游戏是否正在进行，初始值为 `false`，让页面刚打开时保持静止。
      - code:
          source: state
          focus: ["9", "11"]
          show: ["8-9", "11"]
      - text: |
          已保存的早期直行版本使用下面的 `tick` 函数。它先检查 `running`，没有开始就直接返回；开始之后，把方向加到旧头的坐标上，得到新头。`unshift` 将新头放入数组开头，`pop` 删除末尾一节，最后重新绘图。每次都加一节、去一节，蛇的长度就保持不变。
      - code:
          source: first-tick
          focus: all
          show: all
          notes:
            - lines: "3"
              text: 新建一个坐标对象，保留旧头的坐标，让它继续作为身体的一部分。
      - text: |
          一次调用只会前进一步，还需要由浏览器反复调用它。直行版本把 `tick` 交给 `setInterval`，设置为每隔 140 毫秒调用一次。开始按钮的点击事件只负责把 `running` 打开，并更新页面提示；末尾的 `draw()` 仍然负责绘制点击之前的初始画面。
      - code:
          source: first-start
          focus: all
          show: all
      - text: |
          这两段代码保存在 `stages/02-moving.html` 中。该版本点击开始后只会向右移动，还没有处理转向、食物和碰撞，所以蛇会继续走出画布。要让玩家改变路线，需要把按键转换成这里使用的方向增量。

  - id: direction
    title: 在两次移动之间改变方向
    content:
      - text: |
          向右对应 `(1, 0)`，向左就是 `(-1, 0)`。画布的纵坐标向下增加，所以向下对应 `(0, 1)`，向上则是 `(0, -1)`。四个方向都只改变一条坐标轴，也就保证蛇沿格子横向或纵向移动。

          浏览器会在按键事件的 `event.key` 中提供按键名称。把四个方向键名称与坐标增量放进同一张表，就能从收到的按键查出请求的方向。其他按键查不到结果，直接忽略；方向键则调用 `preventDefault()`，避免它们同时触发页面滚动。
      - code:
          source: input
          focus: "1-10"
          show: ["1-10", "15-16"]
      - text: |
          按键事件绑定在画布上，所以画布必须拥有键盘焦点。前面设置的 `tabindex` 让它能够接收焦点，而玩家点击开始按钮后，焦点通常还在按钮上。因此，处理开始动作的 `start` 函数中要调用 `canvas.focus()`，把键盘输入交回棋盘。
      - code:
          source: start
          focus: "9"
          show: ["1", "9", "11"]
      - text: |
          收到方向之后，也不能一律接受。假设蛇正在向右走，它的第二节就在头的左边；如果立即改成向左，下一步就会进入自己的身体。相反方向的两个分量，恰好都等于当前方向取负，因此可以用这个条件拒绝直接掉头。

          只检查相反方向仍然不够。如果蛇还没来得及移动，玩家就在同一个间隔里连续按下“上、左”，第二次输入会把方向从上改成左，结果仍然是从原来的向右掉头。因此，需要记住这个间隔是否已经接受过一次方向输入。
      - code:
          source: state
          focus: "12-13"
          show: "11-13"
      - text: |
          `turned` 初始为 `false`。游戏未运行，或者这个标记已经为 `true` 时，都不再接受方向变化；通过这些检查和掉头检查之后，才保存 `requested`，并把标记设为 `true`。这里不缓存后续按键，同向的方向键也会占用本次输入机会。
      - code:
          source: input
          focus: "11-16"
          show: "8-16"
          notes:
            - lines: "12"
              text: 两个分量必须同时互为相反数，才是完全掉头。
      - text: |
          等到计时器推进下一步时，再将 `turned` 清回 `false`。随后用已经选好的方向计算新头，完成这次移动。JavaScript 会依次执行这些事件，因此当前这次移动不会被中途到来的按键打断；移动结束之后，新的输入机会就可以用于下一步。
      - code:
          source: tick
          focus: "1-4"
          show: ["1-4", "24-25"]

  - id: food
    title: 把食物放在空着的格子里
    content:
      - text: |
          蛇已经可以改变路线，还需要一个值得它追逐的位置。食物同样只占一格，用一个坐标对象就能表示。第一颗食物固定在 `(12, 10)`，与初始蛇头处于同一行，并位于它的右侧。
      - code:
          source: state
          focus: "10"
          show: "8-10"
      - text: |
          食物可以复用 `paintCell`，只需把颜色设为粉色。在 `draw` 中，清空画布之后先画食物，再画蛇。外面的 `if (food)` 用来判断是否有食物：当棋盘已经填满、没有位置放食物时，就跳过这部分绘制。
      - code:
          source: draw
          focus: "4-7"
          show: ["1-11", "13-14"]
      - text: |
          第一颗食物的位置是固定的，但吃完之后，新的食物必须避开蛇占据的格子。如果直接随机选一行、一列，就有可能落在蛇身上；反复重选虽然可行，但棋盘越满，找到空位的机会就越小。

          这里的棋盘只有 400 格，可以先找出全部空位，再从中随机挑选。`placeFood` 创建一个 `empty` 数组，用外层循环遍历行、内层循环遍历列。对于每个 `(x, y)`，用 `snake.some` 检查是否有一节蛇同时拥有相同的横、纵坐标；只有完全没有被占用时，才把它放进 `empty`。
      - code:
          source: food
          focus: "1-9"
          show: "1-9"
          notes:
            - lines: "5"
              text: some 找到一节匹配的蛇身就返回 true；前面的 ! 将条件变成“没有被蛇占据”。
      - text: |
          得到候选列表之后，`Math.random()` 生成一个从 0 开始、小于 1 的数，乘以空位数量，再用 `Math.floor` 向下取整，就得到列表中的一个下标。例如有 5 个空位时，下标只可能是 0 到 4，返回的坐标一定来自空位列表。

          如果列表长度已经为 0，就不能再选下标。这表示整张棋盘都被蛇占满，函数返回 `null`，用一个明确的值表示“没有下一颗食物”。
      - code:
          source: food
          focus: "10-13"
          show: ["1-2", "10-13"]

  - id: growth
    title: 吃到食物时保留尾巴
    content:
      - text: |
          普通移动会加一节头、删一节尾，所以长度保持不变。吃到食物时，如果仍然加头，却保留原来的尾巴，长度就会增加一节，其他身体坐标不需要额外移动。

          是否吃到食物，要用这次即将进入的格子来判断。例如，蛇头在 `(11, 10)`、方向向右，而食物在 `(12, 10)`，那么新头正好落在食物上。此时旧头还没有接触食物，因此不能拿旧头的坐标判断。
      - code:
          source: tick
          focus: "5"
          show: "1-5"
      - text: |
          `eating` 记录这个判断结果。加入新头之后，如果吃到了食物，就调用 `placeFood` 选择下一处空位；没有吃到时，才继续执行原来的 `pop`。最后调用 `draw`，让画面显示更新后的蛇和食物。

          这里要先加入新头，再寻找空位。否则 `placeFood` 看到的还是移动之前的蛇，可能把新头即将占据的格子当成空位。
      - code:
          source: tick
          focus: ["13-15", "20-25"]
          show: ["13-15", "20-25"]
          notes:
            - lines: "21"
              text: 只有没吃到食物时才去掉尾巴；吃到时，数组长度会增加一节。
      - text: |
          分数可以直接从长度得到。初始长度是 3，而且每颗食物恰好增加一节，所以当前长度减 3 就是吃过的食物数量，不必再单独维护一个会变化的分数变量。

          脚本先找到页面上的分数元素，再在每次绘图时把长度差转成字符串，写进它的 `textContent`。例如从初始位置连续向右走四步，头到达 `(12, 10)`，长度变为 4，页面就显示 1 分。
      - code:
          source: state
          focus: "3"
          show: "1-3"
      - code:
          source: draw
          focus: "12"
          show: "8-14"

  - id: collision
    title: 在写入新位置之前检查碰撞
    content:
      - text: |
          新头的坐标可以算出来，并不意味着那个格子允许进入。比如头在最右边的 `(19, 10)` 时再向右走，就会得到 `(20, 10)`，已经超出棋盘范围。进入身体占据的位置也会结束游戏，因此这些判断都需要发生在把新头放入数组之前。

          发生碰撞之后，要让蛇停止，并把原因显示在页面上。原来的 `running` 已经控制着 `tick` 是否执行，只要把它设回 `false`，后续计时器调用就会直接返回。`finish` 把这个动作与更新提示、重新绘图放在一起，碰撞时传入对应的文字即可。
      - code:
          source: state
          focus: "4"
          show: "3-4"
      - code:
          source: finish
          focus: all
          show: all
      - text: |
          墙的判断比较直接：新头的任一坐标小于 0，或大于等于 `size`，就超出了有效范围。身体判断则需要结合尾巴在这一步会不会移动。

          例如，蛇从头到尾位于 `(2, 2) → (2, 3) → (1, 3) → (1, 2)`，此时蛇头向左进入 `(1, 2)`，正好是旧尾巴所在的格子。如果没有吃食物，旧尾巴会在同一次移动中退出，新头可以进入；如果把移动前整条蛇都当成障碍，就会把这次合法移动误判成碰撞。

          因此，不吃食物时用 `slice(0, -1)` 取出尾巴之前的部分，作为本次碰撞检查的范围。这个操作产生一个新数组，不会删除真正的尾巴。吃食物时尾巴需要保留，检查范围就仍然是整条蛇。随后使用 `some` 判断其中是否有一节占据新头的位置。
      - code:
          source: tick
          focus: "6-12"
          show: "1-13"
          notes:
            - lines: "6"
              text: 检查移动后仍会被身体占据的位置；旧尾巴是否退出，由 eating 决定。
            - lines: "11"
              text: 发现碰撞后直接返回，不再执行下面的 unshift 和食物处理。
      - text: |
          墙或身体任一检查成立，就调用 `finish`，根据 `hitWall` 选择提示文字，再结束本次调用。由于此时还没有写入非法的新头，重新绘图时看到的仍然是最后一个合法位置。

  - id: victory
    title: 棋盘没有空位时结束游戏
    content:
      - text: |
          碰撞之外，填满棋盘也是一种结束方式。吃掉最后一个空格上的食物后，新头已经加入，尾巴又被保留，蛇就会占据全部 400 个格子。这时 `placeFood` 找不到空位，返回 `null`。

          于是，在吃食物的分支里检查这个返回值。如果是 `null`，就调用同一个 `finish` 显示获胜信息，并立即返回。下方完整的 `tick` 保留了前面讨论的顺序：先计算下一格以及是否吃食物，检查碰撞，通过之后才修改蛇的位置；随后根据是否吃到食物决定保留尾巴还是删除尾巴。
      - code:
          source: tick
          focus: "16-19"
          show: all
          notes:
            - lines: "18"
              text: finish 已经画过结束画面，因此这里直接返回，不再执行函数末尾的 draw。
      - text: |
          获胜时 `food` 已经是 `null`，所以 `draw` 会跳过食物，画出填满棋盘的蛇，并按长度显示 397 分。`finish` 同时将 `running` 设为 `false`，以后的 `tick` 会在开头返回，不会再尝试读取 `food.x` 或 `food.y`。

  - id: restart
    title: 重新开始时恢复整局状态
    content:
      - text: |
          一局结束后，蛇的位置和长度、行进方向以及食物位置都已经改变。如果按钮只像直行版本那样把 `running` 设为 `true`，游戏就会从旧状态继续；碰撞时可能立刻再次撞上，获胜后则已经没有食物可读。

          因此，开始按钮需要调用 `start`，先恢复初始的三节蛇、向右的方向和第一颗食物，再允许计时器继续推进。页面加载时也有这些初始值，是为了在点击之前显示起始画面；这里再次赋值，则是为了让每次重新开始都回到同一位置。
      - code:
          source: state
          focus: "5"
          show: "3-5"
      - text: |
          取得按钮元素后，`start` 就可以把按钮文字改为“重新开始”，并更新操作提示。它还会清除上一次留下的 `turned` 标记，避免新的一局开头无法接受方向键。最后把焦点移到画布，再重画一遍；蛇恢复为三节之后，分数也会随 `draw` 自动回到 0。
      - code:
          source: start
          focus: ["1-8", "10-12"]
          show: all
          notes:
            - lines: "2"
              text: 每次创建新的三节蛇，覆盖上一局留下的位置和长度。
      - text: |
          函数准备好之后，在脚本末尾把按钮的点击事件绑定到 `start`。这里传入函数本身，而不是立即调用它，浏览器会等到点击时才执行。计时器仍然每隔 140 毫秒请求推进一步；末尾的 `draw()` 负责第一次点击之前的画面，后面的结束标签则依次关闭脚本、页面主体和文档。
      - code:
          source: boot
          focus: ["1-2", "4-6"]
          show: all
      - text: |
          点击事件和计时器都在页面加载时设置一次，没有放进 `start`。因此，反复点击“重新开始”只会重置状态和画面，不会叠加新的计时器。结束后再次点击按钮，蛇回到原来的三格位置，方向键也重新控制这局游戏。
