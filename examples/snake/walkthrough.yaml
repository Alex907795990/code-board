scope_digest: 4e71e9c2d7f0e9ff70521bd39ba59803a1903cb2ea52bbcc7ff90f764509fe86
title: 从零写一个完整的贪吃蛇
subtitle: 一个 HTML 文件，从空白页面到能转向、吃食物、碰撞结束和重新开始的游戏。
intro: |
  我们要做的是一块 20 × 20 的棋盘。点击开始后，蛇每隔 140 毫秒前进一格；方向键控制转向，粉色食物让它增长并得分。撞到墙或身体会结束，填满棋盘就获胜，按钮可以开始新的一局。

  整个游戏写在 `snake.html` 中，用浏览器直接打开就能玩。下面从页面和三节静止的蛇开始，沿着“怎样动起来、怎样吃东西、什么时候停下”逐步补齐。只需要了解 HTML 标签、变量、数组和函数。
steps:
  - id: page
    title: 先给游戏一块画布
    summary: 页面负责放棋盘、分数、按钮和提示，游戏规则稍后写在脚本里。
    content:
      - text: |
          从一个空文件开始。浏览器需要知道这是 HTML、文字采用 UTF-8，以及标签页的标题。页面里只放四样东西：显示得分的文字、开始按钮、一块画布和操作提示。给需要更新的元素取一个 `id`，后面的脚本才能找到它们。

          `canvas` 不是棋盘规则本身，它只提供一块 480 × 480 像素的绘图区域。蛇和食物都由我们画进去。脚本放在这些元素后面，执行时它们已经存在。
      - code:
          source: page
          focus: ["1-5", "17-27"]
          show: ["1-6", "16-27"]
          notes:
            - lines: "24"
              text: tabindex 让画布能接收键盘焦点，aria-label 说明它是什么。稍后开始游戏时，会主动把焦点移到这里。
            - lines: "25"
              text: role="status" 让状态变化也能被读屏软件感知；这里的初始提示告诉玩家怎样开始。
      - text: |
          给这个小窗口加上最基本的样式：480 像素宽的页面居中；标题、分数和按钮横向排列；深色底、浅色字；画布边框标明活动范围。鼠标悬停和键盘焦点各有一个提示，状态文字用黄色与说明区分。样式不参与游戏判断。
      - code:
          source: page
          focus: "6-16"
          show: "6-16"
          caption: 这些规则只决定窗口的排列、颜色、间距和焦点提示。

  - id: draw-snake
    title: 用三个坐标画出一条蛇
    summary: 数组从头到尾排列，画布只负责把格子坐标变成像素。
    content:
      - text: |
          先不让蛇移动。把棋盘分成每行、每列各 20 格，一格就是 480 ÷ 20 = 24 像素。左上角是 `(0, 0)`，向右增加 x，向下增加 y。

          用数组记录蛇占据哪些格子：第一个元素是头，最后一个是尾。起点的头在 `(8, 10)`，后面跟着 `(7, 10)`、`(6, 10)`。这些坐标比像素更适合描述“向右一格”和“是否撞上同一个位置”。
      - code:
          source: state
          focus: ["1-2", "6-8", "13"]
          show: ["1-2", "6-8", "13"]
          notes:
            - lines: "2"
              text: 2d 上下文提供填充颜色、绘制矩形等操作；它不会替我们处理移动或碰撞。
      - text: |
          `paintCell` 只画一格。把格子坐标乘以 24 得到左上角，再向内留 1 像素，宽高各减 2，蛇的相邻两节就不会黏成一整块。
      - code:
          source: paint
          focus: all
          show: all
      - text: |
          再把画一格组成画整条蛇：先用背景色擦掉旧画面，然后遍历数组，头用亮绿，身体用暗绿。每次都从当前坐标重画，画面就不会留下移动的残影。下面先看画蛇的部分，省略的位置稍后加入食物和分数。
      - code:
          source: draw
          focus: ["1-3", "8-11", "13-14"]
          show: ["1-3", "8-11", "13-14"]
      - text: |
          定义函数还不会产生画面。在脚本末尾调用一次 `draw()`，现在就能看见三节静止的蛇。
      - code:
          source: boot
          focus: "3"
          show: "3"

  - id: move
    title: 移动，其实是加头去尾
    summary: 不必逐节搬动身体，只改变数组的两端。
    content:
      - text: |
          现在让蛇向右走。方向用 `(1, 0)` 表示：每次前进，头的 x 加 1，y 不变。另设一个 `running` 开关，让页面刚打开时保持静止，点击开始后才前进。
      - code:
          source: state
          focus: ["9", "11"]
          show: ["8-9", "11"]
      - text: |
          最初的移动函数很短：算出新头，把它插入数组最前面，再删掉最后一节。原来的头自然变成第二节，后面的身体也自然跟上。

          例如 `(8,10) → (7,10) → (6,10)`，走一步后变成 `(9,10) → (8,10) → (7,10)`。长度仍是三格。下图是先写出的直行版本；它暂时还不会吃东西，也不会判断碰撞。
      - code:
          source: first-tick
          focus: all
          show: all
          notes:
            - lines: "5"
              text: 现在每一步都删尾巴。吃食物时需要保留尾巴，后面会改进这一行。
      - text: |
          给按钮接上最简单的启动动作，再让时钟每隔 140 毫秒调用一次 `tick()`。时钟负责“什么时候走”，函数负责“走一步做什么”。没有开始时，函数开头直接返回。
      - code:
          source: first-start
          focus: all
          show: all
          caption: 这是直行版本的启动代码。后面会把点击动作扩展为重置整局状态。
      - text: |
          到这里，点击按钮后就能看到蛇一直向右走。接下来先让它能听懂方向键。

  - id: steer
    title: 把方向键变成下一步的方向
    summary: 每次前进之间最多转一次，蛇不能当场掉头。
    content:
      - text: |
          向上、向下、向左、向右，只是四种不同的坐标增量。画布收到按键时，先查表；不是方向键就忽略。方向键原本可能滚动页面，因此在接管它之后阻止浏览器的默认动作。
      - code:
          source: input
          focus: "1-10"
          show: ["1-10", "15-16"]
      - text: |
          蛇正向右走时，不能直接改成向左，否则新头会钻回自己的第二节。相反的方向恰好是两个分量都取负数，所以用这个条件拒绝掉头。

          还会遇到一个更细的情况：两次移动之间飞快地按“上、左”，如果都立刻接受，结果仍然相当于从右掉头到左。用 `turned` 记住这一步是否已经转过：只接受第一次有效转向，等时钟真正走下一格时，再开放下一次转向。
      - code:
          source: state
          focus: "12"
          show: "11-13"
      - code:
          source: input
          focus: "11-16"
          show: "8-16"
          notes:
            - lines: "11"
              text: 还没开始、已经结束或这一拍已经转过，就不再改变方向。
            - lines: "14"
              text: 只有接受了一个有效方向，才关闭这一拍的转向机会；被拒绝的掉头不会占用它。
      - code:
          source: tick
          focus: "3"
          show: "1-4"
          caption: 每次真正移动时重置 turned，让下一拍可以再次转向。

  - id: eat
    title: 吃到食物，就别删掉尾巴
    summary: 增长沿用同一个移动过程，只改变是否移除最后一节。
    content:
      - text: |
          放入第一颗食物。为了让每次开局都容易观察，它固定在 `(12, 10)`，就在初始蛇头的正前方；后面的食物再随机放置。

          食物也是一格，直接复用 `paintCell`，改用粉色。分数不必另存一份：初始长度是 3，每吃一颗食物长一节，所以当前长度减 3 就是得分。
      - code:
          source: state
          focus: ["3", "10"]
          show: ["3", "8-10"]
      - code:
          source: draw
          focus: ["4-7", "12"]
          show: all
          notes:
            - lines: "4"
              text: 有食物时才画它。棋盘填满后会没有食物，最后会处理这种结束情况。
      - text: |
          关键判断是“下一格的头是否与食物重合”，不是移动前的旧头。无论是否吃到，都先加入新头：吃到时放置下一颗食物，保留原来的尾巴；没有吃到时，才像刚才一样删掉尾巴。
      - code:
          source: tick
          focus: ["5", "13-15", "20-22"]
          show: ["1-5", "13-15", "20-24"]
          notes:
            - lines: "13"
              text: 先把新头放入 snake，再寻找食物的空位，新头所在的格子才不会被误认为空闲。
            - lines: "21"
              text: 原来每一步都执行的 pop，现在只留在没有吃到食物的分支里。
      - text: |
          第四次向右前进时，头到达 `(12, 10)`，长度从 3 变成 4，分数显示 1。现在只剩一个问题：下一颗食物放在哪里？

  - id: food
    title: 从真正的空位里选下一颗食物
    summary: 先列出没有蛇的格子，再随机选一个。
    content:
      - text: |
          随机选两个坐标可能选到蛇身上；如果反复重试，棋盘接近填满时还会越来越难选中空位。这里棋盘只有 400 格，可以直接找出所有空位。

          两层循环遍历每行、每列。`some` 检查蛇是否有一节占据这个坐标；没有，才放进 `empty`。这样候选列表里的每一个位置都可以用。
      - code:
          source: food
          focus: "1-9"
          show: all
          notes:
            - lines: "5"
              text: x 和 y 必须同时相等才算同一格；前面的感叹号表示“没有任何一节在这里”。
      - text: |
          `Math.random()` 给出小于 1 的小数，乘以空位数量后向下取整，就得到合法的数组下标。若列表已经空了，返回 `null`：这不是“再试一次”，而是明确告诉调用方棋盘已经没有空位。
      - code:
          source: food
          focus: "10-13"
          show: ["1-2", "9-13"]

  - id: collide
    title: 新头落下之前，先判断会不会撞上
    summary: 墙和身体都用坐标判断，尾巴是否离开取决于这一拍有没有吃东西。
    content:
      - text: |
          能一直走还不够。合法坐标只有 0 到 19，下一格超出这个范围就撞墙；如果下一格已经被身体占着，就撞到了自己。两种判断都要发生在 `unshift` 之前，否则非法的新头已经写进了游戏状态。

          身体判断还有一个与移动方式直接相关的细节：不吃食物时，旧尾巴这一拍会离开，所以允许新头进入它原来的位置。吃食物时尾巴不走，整条蛇都仍然占位。`slice(0, -1)` 只是临时取出“去掉尾巴的检查范围”，不会修改真正的蛇。
      - code:
          source: tick
          focus: "6-12"
          show: "1-13"
          notes:
            - lines: "6"
              text: 比较的是移动完成后仍会被占据的格子，不能无条件拿旧的整条蛇判断。
            - lines: "11"
              text: 结束后立刻返回，下面的加入新头、吃食物和移动尾巴都不会再发生。
      - text: |
          结束一局不需要销毁画布。把 `running` 关闭，下一次时钟到来时 `tick` 就会直接返回；更新提示，重画当前状态即可。因为碰撞前没有写入非法的新头，画面会停在最后一个合法位置。
      - code:
          source: state
          focus: "4"
          show: "3-5"
      - code:
          source: finish
          focus: all
          show: all

  - id: restart
    title: 用同一个按钮开始新的一局
    summary: 重新开始就是恢复初始状态，时钟和事件只创建一次。
    content:
      - text: |
          最初按钮只把 `running` 设为 true。现在一局结束之后，蛇的位置、长度、方向和食物都已经改变，直接打开这个开关会从旧状态继续。

          把点击动作换成 `start()`：重建最初的三节蛇，恢复向右方向和第一颗食物，清掉上一拍的转向记录，然后开始运行。`draw()` 会根据恢复后的长度自动把分数显示为 0。第一次点击和重新开始使用完全相同的入口。
      - code:
          source: state
          focus: "5"
          show: "3-5"
      - code:
          source: start
          focus: all
          show: all
          notes:
            - lines: "9"
              text: 点击按钮之后焦点本来在按钮上。移到画布后，方向键才能由前面绑定的监听器接收。
      - text: |
          最后把这个函数绑定到按钮，并保留同一个 140 毫秒时钟。它们在页面加载时各设置一次，不放进 `start()`，所以重复开始不会叠加多个时钟、让蛇越跑越快。末尾的 `draw()` 则让玩家在第一次点击前就能看到起点。
      - code:
          source: boot
          focus: ["1-2", "4-6"]
          show: all
          caption: 脚本到这里连接完成，后面的结束标签关闭脚本、页面内容和文档。

  - id: complete
    title: 补上胜利条件，完整走完一拍
    summary: 从决定下一格到画出结果，所有规则现在连成一个完整循环。
    content:
      - text: |
          还有一种结束方式：最后一个空格也被蛇占满。刚才 `placeFood()` 已经用 `null` 表达这个情况。吃到食物之后检查它，调用同一个 `finish()` 宣布胜利，再立即返回。此时 `draw()` 不再画食物，得分仍然来自蛇的最终长度。

          现在把 `tick()` 完整地连起来看：还没开始就不动；开始后计算下一格，判断是否吃食物，再检查碰撞。合法才加头，不吃才去尾，吃到就放置新食物；没有空位则获胜。最后重画画面，等待下一拍。
      - code:
          source: tick
          focus: ["1-2", "4", "16-19", "23-25"]
          show: all
          notes:
            - lines: "2"
              text: 初次等待开始、碰撞结束和胜利结束，都由这同一个开关阻止继续移动。
            - lines: "18"
              text: finish 已经重画了最终画面，返回后不再重复执行本拍末尾的 draw。
      - text: |
          游戏到这里已经完整：打开 `snake.html`，点击开始，用方向键带着蛇吃食物；发生碰撞时停下，再点按钮就回到起点。程序一直在重复同一件事：输入改变方向，时钟推进坐标，规则决定结果，画布显示当前状态。
